modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ivanafanasev006-ctrl/mc-reload-anims/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="kinetrix_logo.png"
displayURL="https://github.com/ivanafanasev006-ctrl/mc-reload-anims"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The animation library. Only needed on the client; servers can run without it.
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

# Optional: detected at runtime, blended smoothly when present.
[[dependencies.${mod_id}]]
    modId="bettercombat"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
