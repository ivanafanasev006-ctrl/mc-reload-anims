mod_description=Kinetrix (beta) by Inclyae: living, jointed player animations in the spirit of Mo'Bends. Real elbows, knees and waist; procedural walking, running, sneaking, swimming, diving, climbing, riding, fighting (sword, axe, trident, bow, crossbow, shield), fishing, eating, rolls, idle fidgets and emotes.\n\nRequires: Player Animator (playerAnimator by KosmX) for Forge 1.20.1.\nOptional, blended automatically when installed: Better Combat, Iron's Spells 'n Spellbooks, and any other playerAnimator-based mod.\nNot needed: bendy-lib (Kinetrix draws elbows, knees and waist itself).\n\n\u0410\u0432\u0442\u043e\u0440: Inclyae. \u0416\u0438\u0432\u044b\u0435 \u0430\u043d\u0438\u043c\u0430\u0446\u0438\u0438 \u0438\u0433\u0440\u043e\u043a\u0430 \u0441\u043e \u0441\u0433\u0438\u0431\u0430\u043c\u0438 \u0432 \u043b\u043e\u043a\u0442\u044f\u0445, \u043a\u043e\u043b\u0435\u043d\u044f\u0445 \u0438 \u043f\u043e\u044f\u0441\u0435.\n\u041d\u0443\u0436\u0435\u043d: Player Animator. \u0421\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c (\u043f\u043e\u0434\u0445\u0432\u0430\u0442\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0441\u0430\u043c): Better Combat, Iron's Spells 'n Spellbooks.

