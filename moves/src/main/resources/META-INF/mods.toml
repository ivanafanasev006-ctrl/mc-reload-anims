modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ivanafanasev006-ctrl/mc-reload-anims/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Animations on Kinetrix and Player Animator by KosmX."
displayURL="https://github.com/ivanafanasev006-ctrl/mc-reload-anims"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
# Plays the moves; needed on the client only.
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
# Bends the elbows, knees and waist in the moves (the moves play without it, stiffly); 1.0.7-beta
# and later also hands sprint + C over from its crawl to the slide.
[[dependencies.${mod_id}]]
    modId="kinetrix"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
