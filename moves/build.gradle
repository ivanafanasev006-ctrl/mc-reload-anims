plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Kinetrix's mixins name Minecraft by its SRG names: remap them for the development game.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // ./gradlew runClient -Pselftest: a flat test world, the moves played and photographed
            // (test/ClientSelfTest), then the game quits.
            if (project.hasProperty('selftest')) {
                property 'kinetrix_moves.selftest', 'true'
                args '--width', '1280', '--height', '720'
                if (project.hasProperty('selftestOnly')) property 'kinetrix_moves.selftest.only', project.property('selftestOnly')
                if (project.hasProperty('selftestFrames')) property 'kinetrix_moves.selftest.frames', 'true'
                if (project.hasProperty('selftestProbe')) property 'kinetrix_moves.selftest.probe', 'true'
            }
        }
        server {
            args '--nogui'
        }
        // ./gradlew runGameTestServer: runs test/MovesGameTests on a server, then exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    maven {
        name = 'KosmX (playerAnimator)'
        url = 'https://maven.kosmx.dev/'
    }
    // Kinetrix itself, from the parent project (./gradlew publish there writes build/repo).
    maven {
        name = 'Kinetrix (local)'
        url = file('../build/repo')
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Our animation layer; Kinetrix draws its bends (elbows, knees, waist).
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
    // Kinetrix in the development client, when it has been published locally. The mod only reaches it
    // by reflection (compat/KinetrixBridge), so it builds and runs without it too.
    if (file('../build/repo/dev/mcreload/kinetrix').exists()) {
        runtimeOnly fg.deobf("dev.mcreload:kinetrix:${kinetrix_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
    // The HUD textures as refined from the author's sketches (art/refined/hud, made by make_hud.py).
    from('../art/refined/hud') {
        include '*/*.png'
        into "assets/${mod_id}/textures/gui/hud"
    }
    // Better Combat reads attack animations from attack_animations/ only: the bow strikes go there too.
    from('src/main/resources/assets/' + mod_id + '/player_animation') {
        include 'bow_strike_*.json'
        into "assets/${mod_id}/attack_animations"
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
