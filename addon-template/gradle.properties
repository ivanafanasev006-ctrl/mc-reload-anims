org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# --- Minecraft / Forge (the same as Kinetrix and the Otherworld pack) ---
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)

# --- Mod: rename these three when you copy the template into your own repository ---
mod_id=bcaddon
mod_name=BC Addon Template
mod_group_id=com.example.bcaddon
mod_license=MIT
mod_version=0.1.0
mod_authors=Inclyae
mod_description=Template of a Better Combat addon: weapon guard (parry window), held heavy attack, extra per-weapon data, its own playerAnimator layer. Works next to Kinetrix.

# --- Dependencies ---
# Better Combat 1.9.0 for Forge 1.20.1 from the Modrinth maven (the version the Otherworld pack uses)
better_combat_version=1.9.0+1.20.1-forge
# playerAnimator, the same build Kinetrix is compiled against
player_anim_version=1.0.2-rc1+1.20
# Cloth Config, needed by Better Combat at runtime (runClient only)
cloth_config_version=11.1.136
