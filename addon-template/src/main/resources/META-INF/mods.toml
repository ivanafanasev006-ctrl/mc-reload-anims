modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Required on both sides: the attack logic runs on the server, the animations on the client.
[[dependencies.${mod_id}]]
    modId="bettercombat"
    mandatory=true
    versionRange="[1.9.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="[1.0.2-rc1,)"
    ordering="AFTER"
    side="BOTH"

# Kinetrix: optional. With it, our animations are blended into its jointed body automatically.
# Make it mandatory=true once the addon uses a Kinetrix API.
[[dependencies.${mod_id}]]
    modId="kinetrix"
    mandatory=false
    versionRange="[1.0.7-beta,)"
    ordering="AFTER"
    side="CLIENT"
