name: Visual self-test

on:
  push:
    branches: [main]
    # The mod, or animations made on the Blockbench rig (those alone run only their own scenarios).
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - 'tools/blockbench/**'
      - '.github/workflows/selftest.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Regex of scenario names to run (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: selftest
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils x11-xserver-utils > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B | head -20 || true

      - name: Animations made on the Blockbench rig, converted for the game
        run: |
          python3 -m pip install --quiet --user numpy pillow
          python3 tools/blockbench/kinetrix_rig.py make build/bbanims/kinetrix_rig.bbmodel
          python3 tools/blockbench/kinetrix_rig.py convert build/bbanims/kinetrix_rig.bbmodel build/bbanims/json
          python3 tools/blockbench/kinetrix_rig.py preview build/bbanims/kinetrix_rig.bbmodel build/bbanims/preview --frames 4
          # Animations uploaded to tools/blockbench/animations play too (a broken file only skips itself).
          for f in tools/blockbench/animations/*.bbmodel; do
            [ -f "$f" ] || continue
            python3 tools/blockbench/kinetrix_rig.py convert "$f" build/bbanims/json \
              && python3 tools/blockbench/kinetrix_rig.py preview "$f" build/bbanims/preview --frames 4 \
              || echo "::warning::$f could not be converted"
          done

      - name: What to run
        id: scope
        if: github.event_name == 'push'
        run: |
          # A push that only touches tools/blockbench plays just the Blockbench animations (99_bb_*).
          git fetch -q --depth=1 origin "${{ github.event.before }}" 2>/dev/null || exit 0
          changed=$(git diff --name-only "${{ github.event.before }}" HEAD)
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^tools/blockbench/'; then
            echo "only=^99" >> "$GITHUB_OUTPUT"
            echo "Only Blockbench files changed: running the 99_bb scenarios"
          fi

      - name: Run Minecraft with the automated test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          GALLIUM_DRIVER: llvmpipe
          ONLY: ${{ github.event.inputs.only || steps.scope.outputs.only }}
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "onboardAccessibility:false" > run/options.txt
          echo "pauseOnLostFocus:false" >> run/options.txt
          echo "renderDistance:6" >> run/options.txt
          echo "simulationDistance:6" >> run/options.txt
          echo "maxFps:60" >> run/options.txt
          echo "tutorialStep:none" >> run/options.txt
          echo "joinedFirstServer:true" >> run/options.txt
          echo "soundCategory_master:0.0" >> run/options.txt
          EXTRA=()
          if [ -n "$ONLY" ]; then EXTRA=("-PselftestOnly=$ONLY"); fi
          timeout 22m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Pselftest "-Pbbanims=$PWD/build/bbanims/json" "${EXTRA[@]}" --no-daemon --stacktrace 2>&1 | tee runclient.log || true

      - name: Publish screenshots to the 'selftest' branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp run/screenshots/*.png /tmp/out/ 2>/dev/null || true
          for f in build/bbanims/preview/*.png; do [ -f "$f" ] && cp "$f" "/tmp/out/bbpreview_$(basename "$f")"; done
          cp run/logs/latest.log /tmp/out/latest.log 2>/dev/null || true
          tail -n 400 runclient.log > /tmp/out/runclient-tail.log 2>/dev/null || true
          ls -la /tmp/out
          cd /tmp/out
          # main keeps 'selftest'; a run on another branch goes to 'selftest-<branch>'.
          OUT=selftest
          if [ "$GITHUB_REF_NAME" != "main" ]; then OUT="selftest-${GITHUB_REF_NAME//\//-}"; fi
          git init -q -b "$OUT"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Self-test of ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$OUT"
