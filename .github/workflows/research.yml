name: Research (mod lists and jar contents)

# Reads things this repository's own tooling cannot reach from a development container
# (CurseForge, Modrinth): the mod list of a CurseForge modpack, and what is inside given mod
# jars (mods.toml, mixins, data-driven files, class list, chosen classes decompiled). Everything
# goes to the job logs (one job per jar, so no log gets too long); nothing is committed.
# Runs by hand, or on a push that changes the request file .github/research/request.env
# (PACK=, JARS=, CLASSES=, FILES= lines; empty = skip).
on:
  push:
    paths: ['.github/research/request.env']
  workflow_dispatch:
    inputs:
      pack:
        description: 'CurseForge modpack slug (empty: skip)'
        default: 'otherworld-dnd'
      jars:
        description: 'jars to dump, space separated: cf:<projectId>:<fileId> or mr:<slug> (newest Forge 1.20.1)'
        default: ''
      classes:
        description: 'regex of class file paths to decompile (empty: none)'
        default: ''
      files:
        description: 'regex of resource paths to print in full'
        default: 'META-INF/mods\.toml$|mixins\.json$'

permissions:
  contents: read

env:
  UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      pack: ${{ steps.r.outputs.pack }}
      jars: ${{ steps.r.outputs.jars }}
      classes: ${{ steps.r.outputs.classes }}
      files: ${{ steps.r.outputs.files }}
    steps:
      - uses: actions/checkout@v5
      - id: r
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            set -a; . <(grep -E '^(PACK|JARS|CLASSES|FILES)=' .github/research/request.env | sed -E "s/=(.*)/='\1'/"); set +a
          else
            PACK='${{ github.event.inputs.pack }}'; JARS='${{ github.event.inputs.jars }}'
            CLASSES='${{ github.event.inputs.classes }}'; FILES='${{ github.event.inputs.files }}'
          fi
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
          echo "jars=$(printf '%s\n' $JARS | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "classes=$CLASSES" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  modpack:
    needs: plan
    if: ${{ needs.plan.outputs.pack != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/research/modpack.py
        env:
          PACK: ${{ needs.plan.outputs.pack }}

  jar:
    needs: plan
    if: ${{ needs.plan.outputs.jars != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.plan.outputs.jars) }}
    steps:
      - uses: actions/checkout@v5
      - name: Dump
        env:
          SPEC: ${{ matrix.spec }}
          CLASSES: ${{ needs.plan.outputs.classes }}
          FILES: ${{ needs.plan.outputs.files }}
        run: |
          ct() { curl -sS --retry 4 --retry-all-errors --retry-delay 3 -A "$UA" "$@"; }
          case "$SPEC" in
            cf:*) IFS=: read -r _ P F <<< "$SPEC"
                  url=$(ct -o /dev/null -w '%{redirect_url}' "https://www.curseforge.com/api/v1/mods/$P/files/$F/download" || true) ;;
            mr:*) url=$(ct "https://api.modrinth.com/v2/project/${SPEC#mr:}/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D" \
                    | jq -r '.[0] | ([.files[] | select(.primary)][0].url // .files[0].url) // empty') ;;
            gh:*) url="https://github.com/${SPEC#gh:}" ;;
          esac
          [ -z "${url:-}" ] && { echo "no download for $SPEC"; exit 1; }
          echo "$SPEC -> $url"
          ct -L -o mod.jar "$url"
          curl -sSL -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          python3 .github/research/dumpjar.py mod.jar
