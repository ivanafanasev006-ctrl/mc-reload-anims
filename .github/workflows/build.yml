name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Read mod version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # GitHub Release: downloadable jar that does not use the Actions artifact quota.
      - name: Publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}-build${{ github.run_number }}"
          FROM=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then FROM=" from branch $GITHUB_REF_NAME"; fi
          gh release create "$TAG" build/libs/*.jar --target "$GITHUB_SHA" \
            --title "MC Reload Animations ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Automatic build of ${GITHUB_SHA::7}${FROM}. Forge 1.20.1, requires playerAnimator." \
            --prerelease

      # Also keep the latest jar (or the failure log) on the 'dist' branch.
      - name: Push to dist branch
        if: always()
        run: |
          mkdir -p /tmp/dist
          cp build/libs/*.jar /tmp/dist/ 2>/dev/null || true
          cp build.log /tmp/dist/ 2>/dev/null || true
          cd /tmp/dist
          # main keeps 'dist'; a build of another branch goes to 'dist-<branch>'.
          OUT=dist
          if [ "$GITHUB_REF_NAME" != "main" ]; then OUT="dist-${GITHUB_REF_NAME//\//-}"; fi
          git init -q -b "$OUT"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }} of ${GITHUB_SHA::7} (${{ job.status }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$OUT"
